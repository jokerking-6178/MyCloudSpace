spring.application.name=MyCloudSpace
server.port=8081

# ---------------------------------------------------------------- database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my-cloud-space}
spring.datasource.username=${DB_USERNAME:postgres}
# No default: the application must not start with a hardcoded password.
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Lazy associations are loaded inside service transactions, not during rendering.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- oauth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# ---------------------------------------------------------------- jwt
jwt.secret.key=${JWT_SECRET}
# 10 hours
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ---------------------------------------------------------------- cors
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------------- aws
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.presigned-url-minutes=15

# ---------------------------------------------------------------- uploads
# max-request-size was previously unset, so it defaulted to 10MB and silently
# capped every upload well below the advertised limit.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:100MB}

# ---------------------------------------------------------------- pricing
app.pricing.rupees-per-gb=7
app.pricing.tier-months=1

# ---------------------------------------------------------------- razorpay
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# ---------------------------------------------------------------- spring ai
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.vectorstore.type=pgvector

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.embedding.options.num-ctx=512

spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW

# ---------------------------------------------------------------- rag
rag.chunk-size=800
rag.min-chunk-size-chars=350
rag.similarity-threshold=0.5
rag.conversation.max-messages=20
rag.conversation.ttl-minutes=120

# ---------------------------------------------------------------- errors
# Never leak internals; the global handler owns every error body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
