spring.application.name=MyCloudSpace
server.port=8081

#postgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/my-cloud-space
spring.datasource.username=postgres
spring.datasource.password=shubham
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#github - Oauth2.0
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.redirect-uri=http://localhost:5173/oauth2/redirect


#Jwt
jwt.secret.key=${JWT_SECRET}

#AWS
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=ap-south-1
aws.bucket.name=${AWS_BUCKET_NAME}

#multipart
spring.servlet.multipart.max-file-size=500MB

#razorpay
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

#springai
#springai
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.vectorstore.type=pgvector

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.embedding.options.num-ctx=512

spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true